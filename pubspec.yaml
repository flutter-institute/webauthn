name: webauthn
description: A plugin implementing the WebAuthn authenticator model for generating Public Key Credentials
version: 0.3.0
homepage:
repository: https://github.com/flutter-institute/webauthn
issue_tracker: https://github.com/flutter-institute/webauthn/issues
platforms:
  android:
  ios:
  windows:

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  byte_extensions: ^0.0.4
  cbor: ^6.5.0
  collection: ^1.19.1
  crypto: ^3.0.7
  crypto_keys: ^0.3.0+2
  equatable: ^2.0.8
  flutter_secure_storage: ^9.2.4
  hex: ^0.2.0
  json_annotation: ^4.10.0
  local_auth: ^2.3.0
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1
  local_auth_windows: ^1.0.11
  logger: ^2.6.2
  path: ^1.9.1
  path_provider: ^2.1.5
  precis: ^0.1.0
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.11.0
  flutter_lints: ^6.0.0
  json_serializable: ^6.12.0
  mockito: ^5.6.3
  sqflite_common_ffi: ^2.3.7+1

flutter:
